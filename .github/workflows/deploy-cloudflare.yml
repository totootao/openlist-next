name: Deploy to Cloudflare Workers

# 为什么用 GitHub Actions 而不是本地 wrangler：
#   本仓库的构建链路（scripts/fetch-frontend.mjs 拉取上游前端产物后编译）
#   需要访问 github.com / codeload.github.com，沙箱环境只能经代理，Runner 可直连；
#   且 Runner 能直连 api.cloudflare.com（沙箱被网络策略拦截）。
#   因此把「构建 + 上传」都放在 Runner 上执行。
#
# 需要的仓库 Secret（Settings → Secrets and variables → Actions）：
#   CLOUDFLARE_API_TOKEN   Cloudflare API Token（需 Workers Scripts:Edit 权限）
#   CLOUDFLARE_ACCOUNT_ID  目标账户 ID
#   JWT_SECRET             Worker Secret，>=16 字符，兼作字段加密与定时任务鉴权
#   ADMIN_PASS             可选，设置后跳过安装向导，直接以该密码初始化 admin
#
# 注意：Worker 的 Secret 不会被 wrangler deploy 覆盖或删除，
#       下面的同步步骤只在值存在时执行，重复部署是幂等的。

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "api/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "wrangler.jsonc"
      - "tsconfig.json"
      - "scripts/**"
      - ".github/workflows/deploy-cloudflare.yml"

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build (fetch frontend + bundle worker)
        run: pnpm run build

      - name: Sanity check build output
        run: |
          set -euo pipefail
          test -f dist/index.html || { echo "::error::dist/index.html 缺失，前端未构建成功"; exit 1; }
          echo "dist 文件数: $(find dist -type f | wc -l)"

      - name: Deploy to Cloudflare Workers
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # 本仓库锁定的 wrangler 4.x 已移除 --yes 参数；通过环境变量
        # CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 提供凭据即为非交互。
        run: pnpm exec wrangler deploy

      - name: Sync Worker secrets (idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          set -euo pipefail
          if [ -n "${JWT_SECRET:-}" ]; then
            printf '%s' "$JWT_SECRET" | pnpm exec wrangler secret put JWT_SECRET
            echo "已同步 JWT_SECRET"
          else
            echo "::warning::JWT_SECRET 未配置，Worker 将无法签名/加密，请补上"
          fi
          if [ -n "${ADMIN_PASS:-}" ]; then
            printf '%s' "$ADMIN_PASS" | pnpm exec wrangler secret put ADMIN_PASS
            echo "已同步 ADMIN_PASS"
          fi

      - name: Show deployed bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deployments list --name openlist-next | head -40
